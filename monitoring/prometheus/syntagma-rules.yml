groups:
  - name: syntagma_pattern_usage
    interval: 60s
    rules:
      # Pattern usage rate
      - record: syntagma:pattern_usage:rate5m
        expr: rate(syntagma_pattern_applied_total[5m])

      - record: syntagma:pattern_usage:rate1h
        expr: rate(syntagma_pattern_applied_total[1h])

      # Top patterns by usage
      - record: syntagma:pattern_usage:top10_30d
        expr: topk(10, increase(syntagma_pattern_applied_total[30d]))

      # Pattern diversity (unique patterns used per service)
      - record: syntagma:pattern_diversity:by_service
        expr: count by (service) (syntagma_pattern_applied_total)

  - name: syntagma_alerts
    interval: 30s
    rules:
      # Alert on banned pattern usage (e.g., Singleton - DP-006)
      - alert: BannedPatternUsed
        expr: increase(syntagma_pattern_applied_total{entity_id="DP-006"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Banned pattern detected: {{ $labels.entity_id }}"
          description: "Singleton pattern (DP-006) used in {{ $labels.context }}. See DR-091 for alternatives."
          alcove_ref: "DR-091"

      # Alert on anti-pattern detection
      - alert: AntiPatternDetected
        expr: increase(syntagma_smell_detected_total{smell_id=~"SMELL-03|SMELL-08"}[10m]) > 5
        for: 5m
        labels:
          severity: info
          team: quality
        annotations:
          summary: "High anti-pattern detection rate"
          description: "{{ $labels.smell_id }} detected {{ $value }} times in 10m"

      # Alert on pattern usage spike (potential copy-paste)
      - alert: PatternUsageSpike
        expr: |
          (
            rate(syntagma_pattern_applied_total[5m])
            /
            rate(syntagma_pattern_applied_total[1h] offset 1h)
          ) > 5
        for: 10m
        labels:
          severity: info
          team: quality
        annotations:
          summary: "Unusual pattern usage spike: {{ $labels.entity_id }}"
          description: "Pattern {{ $labels.entity_id }} usage rate increased 5x (potential copy-paste)"

  - name: syntagma_smell_detection
    interval: 60s
    rules:
      # Smell detection rate
      - record: syntagma:smell_detected:rate1h
        expr: rate(syntagma_smell_detected_total[1h])

      # Smell severity distribution
      - record: syntagma:smell_severity:count
        expr: sum by (severity) (syntagma_smell_detected_total)

      # Code health score (inverse of smell rate)
      - record: syntagma:code_health:score
        expr: |
          100 - (
            rate(syntagma_smell_detected_total[1h]) * 10
          )

  - name: syntagma_refactoring
    interval: 60s
    rules:
      # Refactoring suggestion acceptance rate
      - record: syntagma:refactoring:acceptance_rate
        expr: |
          sum(rate(syntagma_refactoring_applied_total[1h]))
          /
          sum(rate(syntagma_refactoring_suggested_total[1h]))

      # Top refactoring techniques
      - record: syntagma:refactoring:top10_30d
        expr: topk(10, increase(syntagma_refactoring_applied_total[30d]))

  - name: syntagma_api_performance
    interval: 30s
    rules:
      # API latency percentiles
      - record: syntagma:api:latency_p95
        expr: histogram_quantile(0.95, rate(syntagma_api_duration_seconds_bucket[5m]))

      - record: syntagma:api:latency_p99
        expr: histogram_quantile(0.99, rate(syntagma_api_duration_seconds_bucket[5m]))

      # Error rate by endpoint
      - record: syntagma:api:error_rate
        expr: |
          sum by (endpoint) (rate(syntagma_api_errors_total[5m]))
          /
          sum by (endpoint) (rate(syntagma_api_requests_total[5m]))
