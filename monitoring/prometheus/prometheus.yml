global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'syntagma-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load recording/alerting rules
rule_files:
  - 'syntagma-rules.yml'

scrape_configs:
  # Syntagma API server metrics
  - job_name: 'syntagma-api'
    static_configs:
      - targets:
          - 'localhost:8000'  # Syntagma FastAPI /metrics endpoint
    metric_relabel_configs:
      # Add service label
      - source_labels: [__address__]
        target_label: service
        replacement: 'syntagma-api'

      # Normalize Syntagma entity labels
      - source_labels: [entity_id]
        regex: '(DP|RF|LAW|SMELL)-(\d+).*'
        target_label: entity_type_short
        replacement: '$1'

  # Your application using Syntagma
  - job_name: 'payment-service'
    static_configs:
      - targets:
          - 'payment-api:8080'
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'payment-service'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets:
          - 'localhost:9100'

# Remote write to long-term storage (optional)
# remote_write:
#   - url: "https://prometheus-remote-write.example.com/api/v1/write"
#     basic_auth:
