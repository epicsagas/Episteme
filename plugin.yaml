# Hermes plugin manifest (YAML).
# Spec: https://hermes-agent.nousresearch.com/docs/developer-guide/plugins
# Loaded by `hermes plugins` from ~/.hermes/plugins/<name>/plugin.yaml
name: episteme
version: "0.3.13"
description: "Software engineering knowledge graph — design patterns, laws, refactorings, and code smells with graph traversal and AI-powered code analysis."
author:
  name: epicsagas
  url: https://github.com/epicsagas
# Hermes discovers bundled skills via ctx.register_skill() in __init__.py;
# this list documents them so forge doctor can verify the bundle.
provides_skills:
  - architecture-analyst
  - code-reviewer
  - episteme
  - episteme-advisor
  - episteme-researcher
