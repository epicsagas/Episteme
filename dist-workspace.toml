[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "epicsagas/homebrew-tap"
# Customize the Homebrew formula name
formula = "episteme"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-crates"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Whether to sign macOS executables
macos-sign = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Generate and dist a source tarball
source-tarball = true
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-2022"
