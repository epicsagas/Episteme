[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "homebrew"]
# ort-sys prebuilt ONNX Runtime binaries are only available for these two targets.
# x86_64-apple-darwin, musl, Windows, aarch64-linux all fail at build time.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
tap = "epicsagas/homebrew-tap"
formula = "episteme"
publish-jobs = ["homebrew"]
allow-dirty = ["ci"]
macos-sign = false
install-path = "CARGO_HOME"
pr-run-mode = "plan"
source-tarball = true

[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
