name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Rust binaries for multiple targets
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syntagma-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syntagma-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: syntagma-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: syntagma-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/syntagma dist/
          cp target/${{ matrix.target }}/release/syntagma-mcp dist/ || true
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz syntagma syntagma-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Build knowledge data archive
  # ---------------------------------------------------------------------------
  build-data:
    name: Build knowledge data archive
    runs-on: ubuntu-latest
    needs: build-binaries
    outputs:
      archive-name: ${{ steps.pack.outputs.archive-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: x86_64-linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: x86_64-linux-cargo-

      - name: Build syntagma binary
        run: cargo build --release

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package data archive
        id: pack
        run: |
          ./target/release/syntagma dist --out-dir dist/
          ARCHIVE=$(ls dist/syntagma-data-*.tar.gz 2>/dev/null || echo "syntagma-data-${{ steps.version.outputs.version }}.tar.gz")
          echo "archive-name=$(basename $ARCHIVE)" >> "$GITHUB_OUTPUT"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-archive
          path: dist/syntagma-data-*.tar.gz

  # ---------------------------------------------------------------------------
  # 3. Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-binaries, build-data]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
