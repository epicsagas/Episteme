name: Release

on:
  push:
    tags:
      - "vvv*.*.*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Rust binaries for multiple targets
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syntagma-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syntagma-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: syntagma-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: syntagma-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: syntagma-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y libssl-dev:arm64

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: 1
          RUST_BACKTRACE: 1
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/syntagma dist/
          cp target/${{ matrix.target }}/release/syntagma-mcp dist/ 2>/dev/null || true
          cp LICENSE README.md dist/ 2>/dev/null || true
          cd dist
          files=""
          for f in syntagma syntagma-mcp LICENSE README.md; do
            [ -f "$f" ] && files="$files $f"
          done
          tar czf ${{ matrix.artifact }}.tar.gz $files

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/syntagma.exe dist/
          cp target/${{ matrix.target }}/release/syntagma-mcp.exe dist/ 2>/dev/null || true
          cp LICENSE README.md dist/ 2>/dev/null || true
          cd dist
          files=""
          for f in syntagma.exe syntagma-mcp.exe LICENSE README.md; do
            [ -f "$f" ] && files="$files $f"
          done
          7z a ${{ matrix.artifact }}.zip $files

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  # ---------------------------------------------------------------------------
  # 2. Upload pre-built knowledge data archive (built locally, committed to repo)
  # ---------------------------------------------------------------------------
  build-data:
    name: Upload knowledge data archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify data archive exists
        run: |
          ARCHIVE=$(ls dist/syntagma-data-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: dist/syntagma-data-*.tar.gz not found in repo."
            echo "Run 'syntagma dist' locally and commit the archive before tagging."
            exit 1
          fi
          echo "Found: $ARCHIVE ($(du -sh "$ARCHIVE" | cut -f1))"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-archive
          path: dist/syntagma-data-*.tar.gz

  # ---------------------------------------------------------------------------
  # 3. Generate SHA256 checksums for all release assets
  # ---------------------------------------------------------------------------
  checksums:
    name: Generate SHA256 checksums
    needs: [build-binaries, build-data]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > sha256sums.txt 2>/dev/null \
            || sha256sum *.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/sha256sums.txt

  # ---------------------------------------------------------------------------
  # 4. Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-binaries, build-data, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # 5. Publish to crates.io
  # ---------------------------------------------------------------------------
  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6. Update Homebrew tap with pre-built binaries
  # ---------------------------------------------------------------------------
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-')"
    steps:
      - name: Compute SHA256 from release assets
        id: sha
        run: |
          BASE="https://github.com/epicsagas/Syntagma/releases/download/${GITHUB_REF_NAME}"
          dl() {
            for i in 1 2 3; do
              curl -sLf "${BASE}/$1" -o "$2" && return
              sleep 10
            done
            echo "ERROR: failed to download $1" && exit 1
          }
          dl syntagma-macos-aarch64.tar.gz arm.tar.gz
          dl syntagma-macos-x86_64.tar.gz intel.tar.gz
          dl syntagma-linux-x86_64.tar.gz linux_x86_64.tar.gz
          dl syntagma-linux-aarch64.tar.gz linux_aarch64.tar.gz
          echo "arm=$(sha256sum arm.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "intel=$(sha256sum intel.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_x86_64=$(sha256sum linux_x86_64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_aarch64=$(sha256sum linux_aarch64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: epicsagas/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          SHA_ARM: ${{ steps.sha.outputs.arm }}
          SHA_INTEL: ${{ steps.sha.outputs.intel }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.linux_x86_64 }}
          SHA_LINUX_AARCH64: ${{ steps.sha.outputs.linux_aarch64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > Formula/syntagma.rb << RUBY
          class Syntagma < Formula
            desc "Software engineering knowledge graph for AI agents"
            homepage "https://github.com/epicsagas/Syntagma"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/epicsagas/Syntagma/releases/download/v${VERSION}/syntagma-macos-aarch64.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/epicsagas/Syntagma/releases/download/v${VERSION}/syntagma-macos-x86_64.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/epicsagas/Syntagma/releases/download/v${VERSION}/syntagma-linux-aarch64.tar.gz"
                sha256 "${SHA_LINUX_AARCH64}"
              else
                url "https://github.com/epicsagas/Syntagma/releases/download/v${VERSION}/syntagma-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "syntagma"
              bin.install "syntagma-mcp" if File.exist?("syntagma-mcp")
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/syntagma --version")
            end
          end
          RUBY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/syntagma.rb
          git diff --cached --quiet || git commit -m "syntagma ${GITHUB_REF_NAME#v}"
          git push
