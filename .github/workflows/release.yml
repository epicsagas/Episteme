name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Rust binaries for multiple targets
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: episteme-linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: episteme-linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: episteme-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: episteme-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: episteme-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: episteme-windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: episteme-windows-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y libssl-dev:arm64

      - name: Install musl cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: 1
          RUST_BACKTRACE: 1
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/episteme dist/
          cp target/${{ matrix.target }}/release/epis dist/ 2>/dev/null || true
          cp LICENSE README.md dist/ 2>/dev/null || true
          cd dist
          files=""
          for f in episteme epis LICENSE README.md; do
            [ -f "$f" ] && files="$files $f"
          done
          tar czf ${{ matrix.artifact }}.tar.gz $files

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/episteme.exe dist/
          cp target/${{ matrix.target }}/release/epis.exe dist/ 2>/dev/null || true
          cp LICENSE README.md dist/ 2>/dev/null || true
          cd dist
          files=""
          for f in episteme.exe epis.exe LICENSE README.md; do
            [ -f "$f" ] && files="$files $f"
          done
          7z a ${{ matrix.artifact }}.zip $files

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  # ---------------------------------------------------------------------------
  # 2. Upload pre-built knowledge data archive (built locally, committed to repo)
  # ---------------------------------------------------------------------------
  build-data:
    name: Upload knowledge data archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify data archive exists
        run: |
          ARCHIVE=$(ls dist/episteme-data-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: dist/episteme-data-*.tar.gz not found in repo."
            echo "Run 'episteme dist' locally and commit the archive before tagging."
            exit 1
          fi
          echo "Found: $ARCHIVE ($(du -sh "$ARCHIVE" | cut -f1))"

      - name: Upload data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-archive
          path: dist/episteme-data-*.tar.gz

  # ---------------------------------------------------------------------------
  # 3. Generate SBOM and SHA256 checksums
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

  checksums:
    name: Generate SHA256 checksums
    needs: [build-binaries, build-data]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > sha256sums.txt 2>/dev/null \
            || sha256sum *.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/sha256sums.txt

  # ---------------------------------------------------------------------------
  # 4. Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-binaries, build-data, sbom, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
            sbom.spdx.json
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # 5. Publish to crates.io
  # ---------------------------------------------------------------------------
  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95"

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6. Update Homebrew tap with pre-built binaries
  # ---------------------------------------------------------------------------
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-')"
    steps:
      - name: Compute SHA256 from release assets
        id: sha
        run: |
          BASE="https://github.com/epicsagas/Episteme/releases/download/${GITHUB_REF_NAME}"
          dl() {
            for i in 1 2 3; do
              curl -sLf "${BASE}/$1" -o "$2" && return
              sleep 10
            done
            echo "ERROR: failed to download $1" && exit 1
          }
          dl episteme-macos-aarch64.tar.gz arm.tar.gz
          dl episteme-macos-x86_64.tar.gz intel.tar.gz
          dl episteme-linux-x86_64.tar.gz linux_x86_64.tar.gz
          dl episteme-linux-x86_64-musl.tar.gz linux_x86_64_musl.tar.gz
          dl episteme-linux-aarch64.tar.gz linux_aarch64.tar.gz
          echo "arm=$(sha256sum arm.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "intel=$(sha256sum intel.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_x86_64=$(sha256sum linux_x86_64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_x86_64_musl=$(sha256sum linux_x86_64_musl.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_aarch64=$(sha256sum linux_aarch64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: epicsagas/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          SHA_ARM: ${{ steps.sha.outputs.arm }}
          SHA_INTEL: ${{ steps.sha.outputs.intel }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.linux_x86_64 }}
          SHA_LINUX_X86_64_MUSL: ${{ steps.sha.outputs.linux_x86_64_musl }}
          SHA_LINUX_AARCH64: ${{ steps.sha.outputs.linux_aarch64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > Formula/episteme.rb << RUBY
          class Episteme < Formula
            desc "Software engineering knowledge graph for AI agents"
            homepage "https://github.com/epicsagas/Episteme"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/epicsagas/Episteme/releases/download/v${VERSION}/episteme-macos-aarch64.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/epicsagas/Episteme/releases/download/v${VERSION}/episteme-macos-x86_64.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/epicsagas/Episteme/releases/download/v${VERSION}/episteme-linux-aarch64.tar.gz"
                sha256 "${SHA_LINUX_AARCH64}"
              else
                url "https://github.com/epicsagas/Episteme/releases/download/v${VERSION}/episteme-linux-x86_64-musl.tar.gz"
                sha256 "${SHA_LINUX_X86_64_MUSL}"
              end
            end

            def install
              bin.install "episteme"
              bin.install "epis" if File.exist?("epis")
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/episteme --version")
            end
          end
          RUBY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/episteme.rb
          git diff --cached --quiet || git commit -m "Episteme ${GITHUB_REF_NAME#v}"
          git push
