name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Rust binaries for multiple targets
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syntagma-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: syntagma-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: syntagma-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: syntagma-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/syntagma dist/
          cp target/${{ matrix.target }}/release/syntagma-mcp dist/ || true
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz syntagma syntagma-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Upload pre-built knowledge data archive (built locally, committed to repo)
  # ---------------------------------------------------------------------------
  build-data:
    name: Upload knowledge data archive
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Verify data archive exists
        run: |
          ARCHIVE=$(ls dist/syntagma-data-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: dist/syntagma-data-*.tar.gz not found in repo."
            echo "Run 'syntagma dist' locally and commit the archive before tagging."
            exit 1
          fi
          echo "Found: $ARCHIVE ($(du -sh $ARCHIVE | cut -f1))"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-archive
          path: dist/syntagma-data-*.tar.gz

  # ---------------------------------------------------------------------------
  # 3. Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-binaries, build-data]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
