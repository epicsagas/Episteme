name: Eval

on:
  pull_request:
    paths:
      - 'src/**'
      - 'meta/**'
      - 'benchmarks/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'meta/**'
      - 'benchmarks/**'
  workflow_dispatch:
    inputs:
      suite:
        description: "Eval suite to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - search-negative
          - smell-negative
          - analyze-positive
          - traversal

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python
        run: |
          pip install ruff
          ruff check benchmarks/

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Run evaluation (PR — quick suite)
        if: github.event_name == 'pull_request'
        run: python3 benchmarks/eval_runner.py smell-negative

      - name: Run evaluation (full)
        if: github.event_name != 'pull_request'
        run: python3 benchmarks/eval_runner.py ${{ github.event.inputs.suite || 'full' }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: benchmarks/results/eval_*.json
