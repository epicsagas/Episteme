name: Eval

on:
  pull_request:
    paths:
      - 'src/**'
      - 'meta/**'
      - 'benchmarks/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'meta/**'
      - 'benchmarks/**'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Run full evaluation
        run: python3 benchmarks/eval_runner.py full --repeats 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: benchmarks/results/eval_*.json
