name: Eval

on:
  pull_request:
    paths:
      - 'src/**'
      - 'meta/**'
      - 'benchmarks/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'meta/**'
      - 'benchmarks/**'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build

      - name: Run full evaluation
        run: python3 benchmarks/eval_runner.py full --repeats 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: benchmarks/results/eval_*.json
