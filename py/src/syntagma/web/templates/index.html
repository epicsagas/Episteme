<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --pattern: #58a6ff;
      --refactoring: #3fb950;
      --law: #f85149;
      --smell: #d29922;
      --unknown: #6e7681;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }

    .layout {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .02em;
    }

    .sidebar-header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .sidebar-body::-webkit-scrollbar { width: 4px; }
    .sidebar-body::-webkit-scrollbar-track { background: transparent; }
    .sidebar-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin: 16px 0 8px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .stat-card .val {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-card .lbl {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .control-group { margin-bottom: 10px; }

    .control-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      margin-top: 6px;
    }

    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    .legend-list { display: flex; flex-direction: column; gap: 6px; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .legend-seg {
      width: 24px;
      height: 2px;
      border-radius: 1px;
    }

    /* ── Canvas area ── */
    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, #1e2530 1px, transparent 0);
      background-size: 28px 28px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Tooltip ── */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      max-width: 260px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      display: none;
      z-index: 100;
      line-height: 1.6;
    }

    #tooltip .tt-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    #tooltip .tt-type {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    #tooltip .tt-id {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Info panel ── */
    #info-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
      display: none;
      z-index: 50;
    }

    #info-panel.visible { display: block; }

    #info-panel .close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
    }

    #info-panel .close:hover { color: var(--text); }

    #info-panel h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      padding-right: 20px;
    }

    #info-panel .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 10px;
    }

    #info-panel .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin: 3px 0;
    }

    /* ── Loading overlay ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13,17,23,.7);
      z-index: 200;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading.hidden { display: none; }

    /* node labels */
    .node-label {
      font-size: 9px;
      fill: var(--text-muted);
      pointer-events: none;
      dominant-baseline: hanging;
      text-anchor: middle;
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Syntagma</h1>
      <p>Knowledge Graph Explorer</p>
    </div>
    <div class="sidebar-body">

      <div class="section-label">Statistics</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="val">{{ stats.total_entities }}</div>
          <div class="lbl">Entities</div>
        </div>
        <div class="stat-card">
          <div class="val">{{ stats.total_relations }}</div>
          <div class="lbl">Relations</div>
        </div>
        <div class="stat-card">
          <div class="val">{{ stats.by_type.pattern }}</div>
          <div class="lbl">Patterns</div>
        </div>
        <div class="stat-card">
          <div class="val">{{ stats.by_type.refactoring }}</div>
          <div class="lbl">Refactorings</div>
        </div>
      </div>

      <div class="section-label">View</div>
      <div class="control-group">
        <label>Mode</label>
        <select id="viewMode">
          <option value="full">Full Graph</option>
          <option value="entity">Entity Subgraph</option>
          <option value="path">Shortest Path</option>
        </select>
      </div>

      <div id="entityControls" style="display:none">
        <div class="control-group">
          <label>Entity ID</label>
          <input type="text" id="entityId" placeholder="e.g. DP-001, RF-001" />
        </div>
        <div class="control-group">
          <label>Radius</label>
          <select id="radius">
            <option value="1">1 hop</option>
            <option value="2" selected>2 hops</option>
            <option value="3">3 hops</option>
          </select>
        </div>
      </div>

      <div id="pathControls" style="display:none">
        <div class="control-group">
          <label>From</label>
          <input type="text" id="fromEntity" placeholder="e.g. SMELL-01" />
        </div>
        <div class="control-group">
          <label>To</label>
          <input type="text" id="toEntity" placeholder="e.g. LAW-042-S" />
        </div>
      </div>

      <button class="btn btn-primary" id="loadBtn">Load Graph</button>
      <button class="btn btn-ghost" id="resetBtn">Reset View</button>

      <div class="section-label">Legend</div>
      <div class="legend-list">
        <div class="legend-item"><div class="legend-dot" style="background:var(--pattern)"></div> Design Pattern</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--refactoring)"></div> Refactoring</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--law)"></div> Law / Principle</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--smell)"></div> Code Smell</div>
      </div>
      <div style="margin-top:10px">
        <div class="legend-line"><div class="legend-seg" style="background:var(--refactoring)"></div> solves</div>
        <div class="legend-line"><div class="legend-seg" style="background:var(--pattern)"></div> enforces</div>
        <div class="legend-line"><div class="legend-seg" style="background:var(--border)"></div> related_to</div>
      </div>

    </div>
  </aside>

  <!-- Graph -->
  <div id="graph-container">
    <div id="loading"><div class="spinner"></div></div>
    <svg id="svg">
      <defs>
        <marker id="arrow-default" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#30363d" />
        </marker>
        <marker id="arrow-solves" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#3fb950" />
        </marker>
        <marker id="arrow-enforces" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#58a6ff" />
        </marker>
      </defs>
      <g id="zoom-layer">
        <g id="edges-layer"></g>
        <g id="nodes-layer"></g>
      </g>
    </svg>
    <div id="tooltip"></div>
    <div id="info-panel">
      <button class="close" id="closeInfo">✕</button>
      <h3 id="infoTitle"></h3>
      <div id="infoBadge" class="badge"></div>
      <div id="infoMeta"></div>
    </div>
  </div>
</div>

<script>
const COLOR = {
  pattern:     '#58a6ff',
  refactoring: '#3fb950',
  law:         '#f85149',
  smell:       '#d29922',
  unknown:     '#6e7681',
};

const EDGE_COLOR = {
  solves:     '#3fb950',
  enforces:   '#58a6ff',
  solved_by:  '#3fb95066',
  related_to: '#30363d',
  violates:   '#f8514966',
};

function nodeColor(type) { return COLOR[type] || COLOR.unknown; }
function edgeColor(type) { return EDGE_COLOR[type] || EDGE_COLOR.related_to; }
function edgeMarker(type) {
  if (type === 'solves') return 'url(#arrow-solves)';
  if (type === 'enforces') return 'url(#arrow-enforces)';
  return 'url(#arrow-default)';
}

// ── DOM refs ──
const svg        = d3.select('#svg');
const zoomLayer  = svg.select('#zoom-layer');
const edgesLayer = svg.select('#edges-layer');
const nodesLayer = svg.select('#nodes-layer');
const tooltip    = document.getElementById('tooltip');
const infoPanel  = document.getElementById('info-panel');
const loading    = document.getElementById('loading');

// ── Zoom ──
const zoom = d3.zoom()
  .scaleExtent([0.05, 4])
  .on('zoom', e => zoomLayer.attr('transform', e.transform));
svg.call(zoom);

// ── Simulation ──
let simulation = null;

function stopSim() {
  if (simulation) { simulation.stop(); simulation = null; }
}

// ── Controls ──
const viewMode      = document.getElementById('viewMode');
const entityCtrls   = document.getElementById('entityControls');
const pathCtrls     = document.getElementById('pathControls');

viewMode.addEventListener('change', () => {
  entityCtrls.style.display = viewMode.value === 'entity' ? 'block' : 'none';
  pathCtrls.style.display   = viewMode.value === 'path'   ? 'block' : 'none';
});

document.getElementById('loadBtn').addEventListener('click', loadGraph);
document.getElementById('resetBtn').addEventListener('click', resetView);
document.getElementById('closeInfo').addEventListener('click', () => infoPanel.classList.remove('visible'));

// ── Load ──
async function loadGraph() {
  let url = '/api/graph/full';
  const mode = viewMode.value;

  if (mode === 'entity') {
    const id = document.getElementById('entityId').value.trim();
    if (!id) { alert('Entity ID를 입력하세요'); return; }
    url = `/api/graph/entity/${id}?radius=${document.getElementById('radius').value}`;
  } else if (mode === 'path') {
    const from = document.getElementById('fromEntity').value.trim();
    const to   = document.getElementById('toEntity').value.trim();
    if (!from || !to) { alert('두 엔티티 ID를 모두 입력하세요'); return; }
    url = `/api/graph/path/${from}/${to}`;
  }

  loading.classList.remove('hidden');
  infoPanel.classList.remove('visible');

  try {
    const res  = await fetch(url);
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    render(data.elements.nodes, data.elements.edges, mode);
  } catch (err) {
    alert('그래프 로드 실패: ' + err.message);
  } finally {
    loading.classList.add('hidden');
  }
}

// ── Render ──
function render(rawNodes, rawEdges, mode) {
  stopSim();
  edgesLayer.selectAll('*').remove();
  nodesLayer.selectAll('*').remove();

  const W = document.getElementById('graph-container').clientWidth;
  const H = document.getElementById('graph-container').clientHeight;
  const isFull = mode === 'full';

  // Build node/link arrays
  const nodes = rawNodes.map(n => ({ ...n.data }));
  const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
  const links = (rawEdges || [])
    .filter(e => nodeById[e.data.source] && nodeById[e.data.target])
    .map(e => ({ ...e.data, source: e.data.source, target: e.data.target }));

  // Seed positions near center
  nodes.forEach(n => {
    n.x = W / 2 + (Math.random() - .5) * 200;
    n.y = H / 2 + (Math.random() - .5) * 200;
  });

  // ── Edges ──
  const link = edgesLayer.selectAll('line')
    .data(links)
    .join('line')
    .attr('stroke', d => edgeColor(d.type))
    .attr('stroke-width', d => d.type === 'solves' || d.type === 'enforces' ? 1.5 : 1)
    .attr('stroke-opacity', .7)
    .attr('marker-end', d => edgeMarker(d.type));

  // ── Node radius by degree ──
  const degree = {};
  links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    degree[s] = (degree[s] || 0) + 1;
    degree[t] = (degree[t] || 0) + 1;
  });

  const rScale = d3.scaleSqrt()
    .domain([0, d3.max(Object.values(degree)) || 1])
    .range([isFull ? 5 : 7, isFull ? 14 : 20]);

  function nodeR(d) {
    if (d.is_center) return 18;
    return rScale(degree[d.id] || 0);
  }

  // ── Node groups ──
  const node = nodesLayer.selectAll('g')
    .data(nodes)
    .join('g')
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag',  dragged)
      .on('end',   dragEnd))
    .on('mouseover', showTooltip)
    .on('mousemove', moveTooltip)
    .on('mouseout',  hideTooltip)
    .on('click', showInfo);

  // Glow filter per type
  const defs = svg.select('defs');
  Object.entries(COLOR).forEach(([type, color]) => {
    if (defs.select(`#glow-${type}`).empty()) {
      const f = defs.append('filter').attr('id', `glow-${type}`).attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
      f.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
      const merge = f.append('feMerge');
      merge.append('feMergeNode').attr('in', 'blur');
      merge.append('feMergeNode').attr('in', 'SourceGraphic');
    }
  });

  // Circle
  node.append('circle')
    .attr('r', nodeR)
    .attr('fill', d => nodeColor(d.type))
    .attr('fill-opacity', .9)
    .attr('stroke', d => d.is_center ? '#fff' : nodeColor(d.type))
    .attr('stroke-width', d => d.is_center ? 2.5 : 1)
    .attr('stroke-opacity', d => d.is_center ? 1 : .4)
    .attr('filter', d => `url(#glow-${d.type || 'unknown'})`);

  // Label — only show when not full graph or degree > 0
  if (!isFull) {
    node.append('text')
      .text(d => d.label)
      .attr('class', 'node-label')
      .attr('y', d => nodeR(d) + 4)
      .attr('fill', '#8b949e')
      .style('font-size', '9px')
      .style('text-anchor', 'middle')
      .style('dominant-baseline', 'hanging')
      .style('pointer-events', 'none');
  } else {
    // Full graph: only label high-degree nodes
    node.filter(d => (degree[d.id] || 0) >= 3)
      .append('text')
      .text(d => d.label.length > 18 ? d.label.slice(0, 16) + '…' : d.label)
      .attr('class', 'node-label')
      .attr('y', d => nodeR(d) + 3)
      .attr('fill', '#6e7681')
      .style('font-size', '8px')
      .style('text-anchor', 'middle')
      .style('dominant-baseline', 'hanging')
      .style('pointer-events', 'none');
  }

  // ── Simulation ──
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(isFull ? 80 : 120).strength(0.4))
    .force('charge', d3.forceManyBody().strength(isFull ? -180 : -400).distanceMax(isFull ? 300 : 500))
    .force('center', d3.forceCenter(W / 2, H / 2).strength(0.08))
    .force('collide', d3.forceCollide().radius(d => nodeR(d) + (isFull ? 6 : 12)).strength(0.8))
    .force('x', d3.forceX(W / 2).strength(0.02))
    .force('y', d3.forceY(H / 2).strength(0.02))
    .alphaDecay(0.025)
    .on('tick', ticked);

  function ticked() {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => adjustTarget(d).x)
      .attr('y2', d => adjustTarget(d).y);

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  }

  // Pull line end back by arrow + radius so arrow tip doesn't overlap node
  function adjustTarget(d) {
    const dx = d.target.x - d.source.x;
    const dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const r = nodeR(d.target) + 6;
    return { x: d.target.x - (dx / dist) * r, y: d.target.y - (dy / dist) * r };
  }

  // ── Drag ──
  function dragStart(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragEnd(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }

  resetView();
}

function resetView() {
  const W = document.getElementById('graph-container').clientWidth;
  const H = document.getElementById('graph-container').clientHeight;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(1));
}

// ── Tooltip ──
function showTooltip(event, d) {
  tooltip.innerHTML = `
    <div class="tt-title">${d.label}</div>
    <div class="tt-type" style="color:${nodeColor(d.type)}">${d.type || 'unknown'}</div>
    <div class="tt-id">${d.id}</div>
  `;
  tooltip.style.display = 'block';
  moveTooltip(event);
}

function moveTooltip(event) {
  const container = document.getElementById('graph-container').getBoundingClientRect();
  let x = event.clientX - container.left + 14;
  let y = event.clientY - container.top + 14;
  if (x + 280 > container.width)  x = event.clientX - container.left - 280 - 14;
  if (y + 80  > container.height) y = event.clientY - container.top  - 80  - 14;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() { tooltip.style.display = 'none'; }

// ── Info panel ──
function showInfo(event, d) {
  event.stopPropagation();
  document.getElementById('infoTitle').textContent = d.label;
  const badge = document.getElementById('infoBadge');
  badge.textContent = d.type || 'unknown';
  badge.style.background = nodeColor(d.type) + '22';
  badge.style.color = nodeColor(d.type);
  badge.style.border = `1px solid ${nodeColor(d.type)}44`;
  document.getElementById('infoMeta').innerHTML = `
    <div class="meta">ID: ${d.id}</div>
    ${d.category ? `<div class="meta">Category: ${d.category}</div>` : ''}
  `;
  infoPanel.classList.add('visible');
}

svg.on('click', () => infoPanel.classList.remove('visible'));

// ── Boot ──
loadGraph();
</script>
</body>
</html>
