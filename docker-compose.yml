services:
  Episteme-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Episteme-api
    ports:
      - "8000:8000"
    volumes:
      - ~/.Episteme:/root/.Episteme:ro
    environment:
      - EPISTEME_API_KEYS=${EPISTEME_API_KEYS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: Episteme-network
